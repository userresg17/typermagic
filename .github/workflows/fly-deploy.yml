# Deploy do site-otc no Fly.io.
# Requer o secret FLY_API_TOKEN configurado em Settings → Secrets → Actions.
name: fly-deploy

on:
  workflow_dispatch:
  push:
    branches: [main, claude/otc-crypto-site-planning-ctymal]
    paths:
      - "site-otc/**"
      - ".github/workflows/fly-deploy.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency: fly-deploy
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: cria o app se ainda não existir
        run: flyctl apps create operacao-invisivel || true
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: deploy
        run: flyctl deploy --remote-only --ha=false
        working-directory: site-otc
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
