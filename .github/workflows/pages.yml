# Publica o site-otc no GitHub Pages a cada push (preview p/ aprovação).
name: pages

on:
  workflow_dispatch:
  push:
    branches: [claude/otc-crypto-site-planning-ctymal, main]
    paths:
      - "site-otc/**"
      - ".github/workflows/pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: site-otc
      - run: npm run build
        working-directory: site-otc
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site-otc/dist
      - id: deployment
        uses: actions/deploy-pages@v4
